name: Déployer la base Supabase (migrations)

# Applique les fichiers de supabase/migrations/ sur ton projet Supabase.
# Se lance : à la main (Actions > "Déployer la base Supabase" > Run workflow), ou automatiquement
# quand un fichier de supabase/migrations/ change sur main.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   SUPABASE_ACCESS_TOKEN : jeton personnel (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF  : l'identifiant du projet (la partie xxxx de https://xxxx.supabase.co)
#   SUPABASE_DB_PASSWORD  : le mot de passe de la base défini à la création du projet
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "supabase/migrations/**" ]

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          R: ${{ secrets.SUPABASE_PROJECT_REF }}
          P: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$T" ] || [ -z "$R" ] || [ -z "$P" ]; then
            echo "::error::Secrets manquants : SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF et SUPABASE_DB_PASSWORD sont tous requis."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lier le projet et appliquer les migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
