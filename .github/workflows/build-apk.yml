name: Build AFR CHAT APK

# Se déclenche sur push (branche main), sur pull request, et manuellement
# (onglet "Actions" -> "Build AFR CHAT APK" -> "Run workflow").
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Installer Android 35 et Build Tools 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      # --- Firebase ---------------------------------------------------------
      # Le plugin "com.google.gms.google-services" exige la présence de
      # app/google-services.json pour compiler, MÊME en debug.
      # -> Crée un secret de dépôt nommé GOOGLE_SERVICES_JSON contenant le
      #    CONTENU EN BASE64 de ton fichier google-services.json téléchargé
      #    depuis la console Firebase.
      #    (commande locale pour l'encoder : base64 -w0 google-services.json)
      - name: Restaurer google-services.json depuis les secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Le secret GOOGLE_SERVICES_JSON est manquant. Ajoute-le dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      # --- Gradle -------------------------------------------------------------
      # gradle-wrapper.jar n'est volontairement pas versionné dans ce dépôt.
      # setup-gradle installe directement le binaire Gradle (version alignée
      # sur gradle/wrapper/gradle-wrapper.properties), donc pas besoin du jar.
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Régénérer le wrapper (gradlew / gradle-wrapper.jar)
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug (non signé)
        run: ./gradlew assembleDebug --stacktrace

      # --- Release signée (optionnelle) ---------------------------------------
      # Ne s'exécute que si les 4 secrets de signature sont tous présents.
      # Pour les créer :
      #   1. keytool -genkeypair -v -keystore afrchat.jks -keyalg RSA -keysize 2048 -validity 10000 -alias afrchat
      #   2. base64 -w0 afrchat.jks   (colle le résultat dans le secret AFRCHAT_KEYSTORE_BASE64)
      #   3. Ajoute AFRCHAT_STORE_PASSWORD, AFRCHAT_KEY_ALIAS, AFRCHAT_KEY_PASSWORD
      - name: Vérifier si les secrets de signature release sont présents
        id: signing
        run: |
          if [ -n "${{ secrets.AFRCHAT_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.AFRCHAT_STORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.AFRCHAT_KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.AFRCHAT_KEY_PASSWORD }}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restaurer le keystore
        if: steps.signing.outputs.has_signing == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.AFRCHAT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > afrchat-release.jks

      - name: Build release (signée)
        if: steps.signing.outputs.has_signing == 'true'
        env:
          AFRCHAT_STORE_FILE: ${{ github.workspace }}/afrchat-release.jks
          AFRCHAT_STORE_PASSWORD: ${{ secrets.AFRCHAT_STORE_PASSWORD }}
          AFRCHAT_KEY_ALIAS: ${{ secrets.AFRCHAT_KEY_ALIAS }}
          AFRCHAT_KEY_PASSWORD: ${{ secrets.AFRCHAT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # --- Récupération des APK -----------------------------------------------
      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: AFR-CHAT-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publier l'APK release
        if: steps.signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AFR-CHAT-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
